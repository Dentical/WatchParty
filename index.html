        tailwind.config = {

    <!-- Firebase SDK (v13) с Auth и Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child, onValue, update, push, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEhRlMKCHpQSnUd0uvdTfUI-43bCXf7oQ",
            authDomain: "watchparty-9da9a.firebaseapp.com",
            projectId: "watchparty-9da9a",
            storageBucket: "watchparty-9da9a.firebasestorage.app",
            messagingSenderId: "792458685085",
            appId: "1:792458685085:web:c26f197ea2c09af8018274",
            measurementId: "G-J1FERF2L5Z"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        window.db = db;
        window.auth = auth;
        window.dbRefs = { ref, set, get, child, onValue, update, push, remove, serverTimestamp };

        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Ошибка входа:", error);
                alert("Не удалось войти через Google: " + error.message);
            }
        };

        window.logoutAccount = async function() {
            await signOut(auth);
            location.reload();
        };

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('google-login-btn');
            const userProfile = document.getElementById('user-profile-box');
            const userNameDisplay = document.getElementById('user-display-name');
            const usernameInput = document.getElementById('username-input');

            if (user) {
                window.currentUser = user;
                if (loginBtn) loginBtn.classList.add('hidden');
                if (userProfile) userProfile.classList.remove('hidden');
                if (userNameDisplay) userNameDisplay.innerText = user.displayName || 'Пользователь';
                if (usernameInput && user.displayName) {
                    usernameInput.value = user.displayName;
                    usernameInput.disabled = true;
                }
            } else {
                window.currentUser = null;
                if (loginBtn) loginBtn.classList.remove('hidden');
                if (userProfile) userProfile.classList.add('hidden');
                if (usernameInput) usernameInput.disabled = false;
            }
        });
    </script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Клиентская логика -->
    <script>
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                alert('Просмотр кода и отладка заблокированы системой безопасности.');
                return false;
            }
        });

        let currentUser = '';
        let currentRoomId = '';
        let isHost = false;
        let player = null;
        let currentPlaylist = [];
        let currentVideoIndex = 0;
        let isRemoteAction = false;

        function onYouTubeIframeAPIReady() {}

        function initPlayer(videoId, seekToTime = 0) {
            if (player) {
                player.loadVideoById({videoId: videoId, startSeconds: seekToTime});
                return;
            }
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'playsinline': 1, 'autoplay': 1, 'rel': 0, 'start': Math.floor(seekToTime) },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (!isHost || isRemoteAction) return;
            
            if (event.data === YT.PlayerState.PLAYING) {
                updatePlayerStateInFirebase('play', player.getCurrentTime());
            } else if (event.data === YT.PlayerState.PAUSED) {
                updatePlayerStateInFirebase('pause', player.getCurrentTime());
            }
        }

        async function updatePlayerStateInFirebase(action, time) {
            await window.dbRefs.update(window.dbRefs.ref(window.db, `rooms/${currentRoomId}/playerState`), {
                action: action,
                time: time,
                serverTime: window.dbRefs.serverTimestamp()
            });
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function createRoom() {
            const usernameInput = document.getElementById('username-input').value.trim();
            const password = document.getElementById('create-pass-input').value;
            
            if (!usernameInput) { alert('Введите ваше имя или войдите в аккаунт!'); return; }
            if (!window.currentUser) { alert('Пожалуйста, войдите в аккаунт через Google сверху!'); return; }

            currentUser = usernameInput;
            isHost = true;
            currentRoomId = Math.random().toString(36).substring(2, 6).toUpperCase();

            const roomRef = window.dbRefs.ref(window.db, 'rooms/' + currentRoomId);
            await window.dbRefs.set(roomRef, {
                password: password || '',
                playlist: [{ id: 'jfKfPfyJRdk', title: 'Lofi Hip Hop Radio' }],
                currentIndex: 0,
                playerState: { action: 'play', time: 0, serverTime: window.dbRefs.serverTimestamp() },
                users: { [window.currentUser.uid]: { name: currentUser, isHost: true } },
                messages: {}
            });

            enterRoomUI();
        }

        async function joinRoom() {
            const usernameInput = document.getElementById('username-input').value.trim();
            const roomId = document.getElementById('join-id-input').value.trim().toUpperCase();
            const password = document.getElementById('join-pass-input').value;

            if (!usernameInput || !roomId) { alert('Введите имя и ID комнаты!'); return; }
            if (!window.currentUser) { alert('Пожалуйста, войдите в аккаунт через Google сверху!'); return; }

            const roomRef = window.dbRefs.ref(window.db, 'rooms/' + roomId);
            const snapshot = await window.dbRefs.get(roomRef);

            if (!snapshot.exists()) {
                alert('Комната не найдена!');
                return;
            }

            const roomData = snapshot.val();
            if (roomData.password && roomData.password !== password) {
                alert('Неверный пароль комнаты!');
                return;
            }

            const usersCount = roomData.users ? Object.keys(roomData.users).length : 0;
            if (usersCount >= 20) {
                alert('В комнате уже максимальное количество участников (20)!');
                return;
            }

            currentUser = usernameInput;
            isHost = false;
            currentRoomId = roomId;

            await window.dbRefs.update(window.dbRefs.ref(window.db, `rooms/${roomId}/users`), {
                [window.currentUser.uid]: { name: currentUser, isHost: false }
            });

            enterRoomUI();
        }

        function enterRoomUI() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            document.getElementById('room-id-display').innerText = currentRoomId;

            const badge = document.getElementById('role-badge');
            const hostPanel = document.getElementById('host-controls-panel');
            const guestNotice = document.getElementById('guest-notice');

            if (isHost) {
                badge.className = "bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded";
                badge.innerText = "ХОСТ";
                hostPanel.classList.remove('hidden');
                guestNotice.classList.add('hidden');
            } else {
                badge.className = "bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded";
                badge.innerText = "УЧАСТНИК";
                hostPanel.classList.add('hidden');
                guestNotice.classList.remove('hidden');
            }

            const roomRef = window.dbRefs.ref(window.db, 'rooms/' + currentRoomId);
            
            window.dbRefs.onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (data.playlist) {
                    currentPlaylist = Object.values(data.playlist);
                    renderPlaylist();
                }

                if (data.currentIndex !== undefined && data.currentIndex !== currentVideoIndex) {
                    currentVideoIndex = data.currentIndex;
                }

                // Расчет актуальной позиции видео с учетом задержки и опоздания участника
                if (data.playerState && data.playlist && data.playlist[currentVideoIndex]) {
                    const videoId = data.playlist[currentVideoIndex].id;
                    const state = data.playerState;
                    
                    let targetTime = state.time || 0;
                    if (state.action === 'play' && state.serverTime) {
                        const elapsedServerTime = (Date.now() - state.serverTime) / 1000;
                        if (elapsedServerTime > 0 && elapsedServerTime < 7200) {
                            targetTime += elapsedServerTime;
                        }
                    }

                    if (!player) {
                        initPlayer(videoId, targetTime);
                    } else {
                        const activeVideoId = player.getVideoData ? player.getVideoData().video_id : null;
                        if (activeVideoId !== videoId) {
                            player.loadVideoById({videoId: videoId, startSeconds: targetTime});
                        } else if (!isHost) {
                            isRemoteAction = true;
                            if (Math.abs(player.getCurrentTime() - targetTime) > 2.0) {
                                player.seekTo(targetTime, true);
                            }
                            if (state.action === 'play') {
                                player.playVideo();
                            } else if (state.action === 'pause') {
                                player.pauseVideo();
                            }
                            setTimeout(() => { isRemoteAction = false; }, 500);
                        }
                    }
                }

                if (data.users) {
                    updateUsersList(Object.values(data.users));
                }

                if (data.messages) {
                    renderChat(Object.values(data.messages));
                }
            });
        }

        function leaveRoom() {
            location.reload();
        }

        function copyRoomLink() {
            navigator.clipboard.writeText(currentRoomId);
            alert('ID комнаты скопирован: ' + currentRoomId);
        }

        async function addVideo() {
            if (!isHost) return;
            const input = document.getElementById('video-url-input');
            const url = input.value.trim();
            const videoId = extractVideoId(url);
            if (!videoId) { alert('Некорректная ссылка YouTube!'); return; }

            const playlistRef = window.dbRefs.ref(window.db, `rooms/${currentRoomId}/playlist`);
            const snapshot = await window.dbRefs.get(playlistRef);
            const currentList = snapshot.exists() ? Object.values(snapshot.val()) : [];

            if (currentList.length >= 20) {
                alert('Лимит очереди (максимум 20 видео).');
                return;
            }

            currentList.push({ id: videoId, title: 'Видео [' + videoId + ']' });
            await window.dbRefs.set(playlistRef, currentList);
            input.value = '';

            if (currentList.length === 1) {
                selectVideo(0);
            }
        }

        function dropVideo(event) {
            event.preventDefault();
            if (!isHost) return;
            const text = event.dataTransfer.getData('text');
            const videoId = extractVideoId(text);
            if (videoId) {
                addVideoDirect(videoId);
            }
        }

        async function addVideoDirect(videoId) {
            const playlistRef = window.dbRefs.ref(window.db, `rooms/${currentRoomId}/playlist`);
            const snapshot = await window.dbRefs.get(playlistRef);
            const currentList = snapshot.exists() ? Object.values(snapshot.val()) : [];
            if (currentList.length < 20) {
                currentList.push({ id: videoId, title: 'Видео [' + videoId + ']' });
                await window.dbRefs.set(playlistRef, currentList);
                if (currentList.length === 1) {
                    selectVideo(0);
                }
            }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist-container');
            document.getElementById('queue-count').innerText = currentPlaylist.length;

            if (currentPlaylist.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Плейлист пуст.</p>`;
                return;
            }

            container.innerHTML = currentPlaylist.map((item, index) => `
                <div onclick="${isHost ? `selectVideo(${index})` : ''}" class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900 border ${index === currentVideoIndex ? 'border-red-500' : 'border-slate-800'} ${isHost ? 'hover:bg-slate-800 cursor-pointer' : ''} transition">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="text-xs font-mono text-slate-500">#${index + 1}</span>
                        <span class="text-xs truncate text-slate-200">${item.title}</span>
                    </div>
                    ${isHost ? `<button onclick="event.stopPropagation(); removeVideo(${index})" class="text-slate-500 hover:text-red-400 text-xs px-2">✕</button>` : ''}
                </div>
            `).join('');
        }

        async function selectVideo(index) {
            if (!isHost) return;
            await window.dbRefs.update(window.dbRefs.ref(window.db, `rooms/${currentRoomId}`), {
                currentIndex: index,
                playerState: { action: 'play', time: 0, serverTime: window.dbRefs.serverTimestamp() }
            });
        }

        async function removeVideo(index) {
            if (!isHost) return;
            currentPlaylist.splice(index, 1);
            await window.dbRefs.set(window.dbRefs.ref(window.db, `rooms/${currentRoomId}/playlist`), currentPlaylist);
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const messagesRef = window.dbRefs.ref(window.db, `rooms/${currentRoomId}/messages`);
            const newMsgRef = window.dbRefs.push(messagesRef);
            await window.dbRefs.set(newMsgRef, {
                user: currentUser,
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            input.value = '';
        }

        function renderChat(messages) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = messages.map(msg => `
                <div>
                    <span class="text-[10px] text-slate-500">[${msg.time}]</span>
                    <span class="font-bold text-red-400">${msg.user}:</span> 
                    <span class="text-slate-300">${msg.text}</span>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function updateUsersList(users) {
            document.getElementById('users-count').innerText = users.length;
            const container = document.getElementById('users-list');
            container.innerHTML = users.map(u => `
                <div class="flex items-center justify-between p-2 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="font-medium text-slate-200">${u.name}</span>
                    ${u.isHost ? '<span class="bg-red-950 text-red-400 border border-red-800 text-[10px] px-2 py-0.5 rounded-full">Хост</span>' : ''}
                </div>
            `).join('');
        }

        function switchMobileTab(tab) {
            const vPane = document.getElementById('pane-video');
            const cPane = document.getElementById('pane-chat');
            const bVid = document.getElementById('m-tab-video');
            const bChat = document.getElementById('m-tab-chat');

            if (tab === 'video') {
                vPane.classList.remove('hidden');
                cPane.classList.add('hidden');
                cPane.classList.remove('flex');
                bVid.className = "flex-1 py-2.5 text-center text-red-500 border-b-2 border-red-500 font-semibold";
                bChat.className = "flex-1 py-2.5 text-center text-slate-400";
            } else {
                vPane.classList.add('hidden');
                cPane.classList.remove('hidden');
                cPane.classList.add('flex');
                bChat.className = "flex-1 py-2.5 text-center text-red-500 border-b-2 border-red-500 font-semibold";
                bVid.className = "flex-1 py-2.5 text-center text-slate-400";
            }
        }

        function switchChatTab(tab) {
            const chatBtn = document.getElementById('tab-chat-btn');
            const usersBtn = document.getElementById('tab-users-btn');
            const chatPane = document.getElementById('chat-pane');
            const usersPane = document.getElementById('users-pane');

            if (tab === 'chat') {
                chatBtn.className = "flex-1 py-3 text-center text-red-500 border-b-2 border-red-500 font-semibold";
                usersBtn.className = "flex-1 py-3 text-center text-slate-400 hover:text-slate-200";
                chatPane.classList.remove('hidden');
                chatPane.classList.add('flex');
                usersPane.classList.add('hidden');
                usersPane.classList.remove('flex');
            } else {
                usersBtn.className = "flex-1 py-3 text-center text-red-500 border-b-2 border-red-500 font-semibold";
                chatBtn.className = "flex-1 py-3 text-center text-slate-400 hover:text-slate-200";
                usersPane.classList.remove('hidden');
                usersPane.classList.add('flex');
                chatPane.classList.add('hidden');
                chatPane.classList.remove('flex');
            }
        }
    </script>
</body>
</html>
